<!doctype html>
<meta charset="utf-8">
<title>SparkLab harness</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#252a34; --fg:#e6e8ee; --dim:#8b93a3;
    --accent:#5aa9e6; --ok:#4ec9a0; --warn:#e6b45a; --err:#e6685a;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace }
  header { display:flex; gap:1rem; align-items:center; padding:.6rem 1rem;
           border-bottom:1px solid var(--line); background:var(--panel) }
  header h1 { font-size:14px; margin:0; font-weight:600; letter-spacing:.02em }
  .pill { padding:.15rem .5rem; border-radius:99px; font-size:12px; border:1px solid var(--line) }
  .pill.on { color:var(--ok); border-color:var(--ok) }
  .pill.off { color:var(--dim) }
  .pill.err { color:var(--err); border-color:var(--err) }
  .pill.warn { color:var(--warn); border-color:var(--warn) }
  main { display:grid; grid-template-columns:1fr 380px; gap:1rem; padding:1rem; align-items:start }
  @media (max-width:900px){ main { grid-template-columns:1fr } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:.8rem }
  .panel h2 { font-size:12px; margin:0 0 .6rem; color:var(--dim); text-transform:uppercase; letter-spacing:.08em }
  #cams { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:.6rem }
  figure { margin:0 }
  figure img { width:100%; display:block; border-radius:6px; background:#000; aspect-ratio:16/9; object-fit:cover }
  figcaption { color:var(--dim); font-size:12px; padding-top:.25rem }
  label { display:block; color:var(--dim); font-size:12px; margin:0 0 .2rem }
  input[type=text] { width:100%; padding:.45rem .6rem; background:#0c0e12; color:var(--fg);
                     border:1px solid var(--line); border-radius:6px; font:inherit }
  button { padding:.45rem .8rem; background:#20242d; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; font:inherit; cursor:pointer; margin-top:.45rem; width:100% }
  button:hover:not(:disabled) { border-color:var(--accent) }
  button:disabled { opacity:.5; cursor:default }
  button.primary { border-color:var(--accent); color:var(--accent) }
  button.danger { border-color:var(--err); color:var(--err) }
  .hint { color:var(--dim); font-size:11px; margin-top:.3rem }
  .sep { height:1px; background:var(--line); margin:1rem 0 .8rem }
  #trace { max-height:38vh; overflow:auto; font-size:12px }
  .ev { padding:.4rem 0; border-bottom:1px solid var(--line) }
  .ev .t { color:var(--dim) }
  .ev .task { color:var(--accent) }
  .ev.error { color:var(--err) }
  .ev.manual .task { color:var(--warn) }
  dl { display:grid; grid-template-columns:auto 1fr; gap:.15rem .6rem; margin:0; font-size:12px }
  dt { color:var(--dim) } dd { margin:0; overflow-wrap:anywhere }
  #err { color:var(--err); font-size:12px; min-height:1.2em; margin-top:.5rem }
</style>

<header>
  <h1>SparkLab harness</h1>
  <span id="p-rollout" class="pill off">rollout ?</span>
  <span id="p-agent" class="pill off">agent ?</span>
  <span id="p-task" class="pill off">task —</span>
</header>

<main>
  <div class="panel">
    <h2>Cameras</h2>
    <div id="cams"></div>
  </div>

  <div>
    <div class="panel">
      <h2>Control</h2>

      <label for="task">Task → VLA (runs immediately)</label>
      <input id="task" type="text" placeholder="pick up the scissors">
      <button id="settask" class="primary">Send task to VLA</button>

      <div class="sep"></div>

      <label for="goal">Goal → reasoning agent (it decomposes this)</label>
      <input id="goal" type="text" placeholder="clear the table into the cardboard box">
      <button id="sendgoal">Send task to reasoning agent</button>

      <div class="sep"></div>

      <button id="reset" class="danger">Reset &amp; park home</button>
      <div class="hint">Stops the agent, ramps both arms home over ~5 s, and
        holds there until you send a task.</div>

      <div id="err"></div>
    </div>

    <div class="panel" style="margin-top:1rem">
      <h2>Status</h2>
      <dl id="status"></dl>
    </div>

    <div class="panel" style="margin-top:1rem">
      <h2>Agent trace</h2>
      <div id="trace"></div>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const err = m => { $("#err").textContent = m || ""; };

async function post(path, body) {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                              body: JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({}));
  if (!r.ok || j.error) err(j.error || `HTTP ${r.status}`); else err("");
  return {ok: r.ok && !j.error, body: j};
}

// ---- cameras. One <img> per camera, refreshed by cache-busting the URL.
// MJPEG would be fewer requests, but the rollout serves discrete JPEGs and a
// dropped poll here must never queue work on the control loop.
let cams = [];
function syncCams(list) {
  if (JSON.stringify(list) === JSON.stringify(cams)) return;
  cams = list;
  $("#cams").innerHTML = list.map(c =>
    `<figure><img id="cam-${c}" alt="${c}"><figcaption>${c}</figcaption></figure>`).join("")
    || `<p style="color:var(--dim)">no frames — is the rollout running?</p>`;
}
function refreshCams() {
  for (const c of cams) {
    const img = document.getElementById(`cam-${c}`);
    if (img) img.src = `/api/frame/${c}?t=${Date.now()}`;
  }
}

// ---- status
let lastResets = null;          // watched by the reset button, see below
function renderStatus(s) {
  const r = s.rollout || {}, o = s.observation || {}, a = s.agent || {};
  const alive = !r.error;
  lastResets = alive ? (r.resets ?? null) : null;

  // Three stopped-ness states, and the operator needs to tell them apart:
  // down (nothing there), held (parked at home, waiting for a task), paused
  // (stopped mid-task, the task still stands).
  const stopped = r.held ? "parked — send a task" : r.paused ? "rollout paused" : null;
  $("#p-rollout").className = "pill " + (!alive ? "err" : stopped ? "warn" : "on");
  $("#p-rollout").textContent = !alive ? "rollout down" : (stopped || "rollout live");
  $("#p-agent").className = "pill " + (a.running ? "on" : "off");
  $("#p-agent").textContent = `agent ${a.kind}${a.running ? " running" : " idle"}`;
  $("#p-task").className = "pill " + (r.task ? "on" : "off");
  $("#p-task").textContent = r.task ? `task: ${r.task}` : "task —";

  const rows = {
    "rollout": r.error || `${r.ticks ?? "?"} ticks, up ${r.uptime_s ?? "?"}s`,
    "last event": r.last_event || "—",
    "frame age": o.age_s == null ? "—" : `${o.age_s}s`,
    "goal": a.goal || "(unset)",
    "agent error": a.last_error || "none",
  };
  $("#status").innerHTML = Object.entries(rows)
    .map(([k,v]) => `<dt>${k}</dt><dd>${escapeHtml(String(v))}</dd>`).join("");
  syncCams(o.cameras || []);
  if (!$("#goal").matches(":focus") && a.goal && !$("#goal").value) $("#goal").value = a.goal;
}
const escapeHtml = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function poll() {
  try { renderStatus(await (await fetch("/api/state")).json()); }
  catch (e) { $("#p-rollout").className = "pill err"; $("#p-rollout").textContent = "harness down"; }
}

// ---- trace, over SSE
function addEvent(ev) {
  const t = new Date(ev.at*1000).toLocaleTimeString();
  let cls = "ev", body;
  if (ev.kind === "decision") {
    body = (ev.task ? `<span class="task">→ ${escapeHtml(ev.task)}</span><br>` : "")
         + escapeHtml(ev.reasoning || "");
    if (ev.error) { cls += " error"; body = escapeHtml(ev.error); }
  } else if (ev.kind === "manual") {
    cls += " manual"; body = `<span class="task">manual → ${escapeHtml(ev.task)}</span>`;
  } else if (ev.kind === "error") {
    cls += " error"; body = escapeHtml(ev.error || "");
  } else if (ev.kind === "done") {
    body = `<span style="color:var(--ok)">goal complete</span> ${escapeHtml(ev.reasoning||"")}`;
  } else if (ev.kind === "goal") {
    body = `goal set: ${escapeHtml(ev.goal || "(cleared)")}`;
  } else {
    body = `agent ${ev.running ? "started" : "stopped"}`;
  }
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = `<span class="t">${t}</span> ${body}`;
  $("#trace").prepend(div);
  while ($("#trace").children.length > 200) $("#trace").lastChild.remove();
}
new EventSource("/api/events").onmessage = e => addEvent(JSON.parse(e.data));

// ---- the three controls ----------------------------------------------------

// 1. Task straight to the VLA. retarget() clears the policy's queued chunk, so
//    this lands on the next tick rather than after up to 30 stale actions.
$("#settask").onclick = async () => {
  const task = $("#task").value.trim();
  if (!task) return err("type a task first");
  await post("/api/task", {task});
};

// 2. Goal to the reasoning agent. Setting the goal resets the agent and leaves
//    it stopped, so this arms the loop straight after — one button, not two.
$("#sendgoal").onclick = async () => {
  const goal = $("#goal").value.trim();
  if (!goal) return err("type a goal first");
  const r = await post("/api/goal", {goal});
  if (r.ok) await post("/api/agent", {action:"start"});
};

// 3. Reset & park home. Three things worth knowing about this one:
//
//    - It stops the agent FIRST. Homing while the agent loop is running is
//      undone within one interval, when the next decision retargets the policy.
//    - POST /cmd only QUEUES; it returns before the arms have moved. The ramp
//      runs in the rollout's loop thread and takes up to reset_timeout_s (8 s
//      by default), so the button stays busy rather than looking inert.
//    - Completion is read from the rollout's own `resets` counter, which
//      do_reset() increments only after homing finishes. That is a real
//      completion signal; a fixed timer would just be a guess.
// go_home is a 5 s eased ramp plus up to 8 s of settle, then the scene reset.
const RESET_TIMEOUT_MS = 18000;
$("#reset").onclick = async () => {
  const btn = $("#reset");
  if (btn.disabled) return;
  const before = lastResets;
  btn.disabled = true;
  const label = btn.textContent;
  try {
    await post("/api/agent", {action:"stop"});
    const r = await post("/api/cmd", {cmd:"reset"});
    if (!r.ok) return;
    const t0 = Date.now();
    while (Date.now() - t0 < RESET_TIMEOUT_MS) {
      btn.textContent = `Homing… ${((Date.now()-t0)/1000).toFixed(1)}s`;
      await new Promise(r => setTimeout(r, 200));
      // lastResets is refreshed by poll(); null means the rollout went away.
      if (before != null && lastResets != null && lastResets > before) return;
    }
    err("reset did not confirm within 12s — check the rollout log; the arms " +
        "were ramped, not teleported, so they are wherever the ramp reached");
  } finally {
    btn.textContent = label;
    btn.disabled = false;
  }
};

$("#task").addEventListener("keydown", e => { if (e.key === "Enter") $("#settask").click(); });
$("#goal").addEventListener("keydown", e => { if (e.key === "Enter") $("#sendgoal").click(); });

poll(); setInterval(poll, 1000); setInterval(refreshCams, 400);
</script>

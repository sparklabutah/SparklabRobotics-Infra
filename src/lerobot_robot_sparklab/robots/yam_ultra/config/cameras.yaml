# Camera rig for the bimanual YAM-Ultra: two RealSense D405 wrist cameras
# and one D415 third-person/overhead view.
#
# Ids match the relay's fixed VR panel slots (top | left_wrist |
# right_wrist — see the main README's "Adapting to a different arm") and
# are also the dataset key names LeRobot records under
# (observation.images.<id>). Both relay/server.py (live VR view) and
# yam_ultra/lerobot_follower.py (dataset recording) read this one file.
#
# advanced_json points at a RealSense advanced-mode preset (exported from
# realsense-viewer's "Save settings to file") that locks exposure/white
# balance/color-correction/etc. Not applied automatically — run
# apply_camera_presets.py once per power-up to push it onto the hardware;
# it sticks in the device's own memory until power is lost, so relay/
# lerobot-record runs afterward just see an already-locked camera.
#
# exposure / white_balance / gain (below, unused currently) are a lighter-
# weight alternative: just those three options, applied inline by the
# relay's RealSenseCameraReader on every connect (no separate script/
# advanced mode). Derive with calibrate_camera.py. Don't set both for the
# same camera.
#
# height / crop_height: recorded video is 640x360 to match the
# allenai/MolmoAct2-BimanualYAM-Dataset schema (so a MolmoAct2 checkpoint's
# camera preprocessing sees the same frame shape it was trained on).
# `height` is what's actually requested from the sensor — it must be a
# profile the camera really offers. The D435 top camera supports 360
# natively, so it captures there directly (no crop needed). The D405 wrist
# cameras do NOT have a 360-tall mode at all (640-wide, only 480 is
# offered — confirmed via `rs.sensor.get_stream_profiles()`, not assumed):
# they capture natively at 480 and `crop_height: 360` center-crops 60px off
# the top and bottom in software (see _center_crop_height in server.py /
# yam_ultra_follower.py) rather than stretch-resizing, which would distort
# proportions relative to MolmoAct2's training frames.
cameras:
  left_wrist:  { serial: "353322271147", model: D405, width: 640, height: 480, crop_height: 360, advanced_json: hand_default.json }
  right_wrist: { serial: "323622272781", model: D405, width: 640, height: 480, crop_height: 360, advanced_json: hand_default.json }
  top:         { serial: "243322071190", model: D435, width: 640, height: 360, advanced_json: thirdperson_default.json }

[project]
# The distribution name MUST keep the `lerobot_robot_` prefix: every
# `lerobot-*` CLI calls register_third_party_plugins(), which scans installed
# distributions for that prefix and imports the matching top-level module.
# That import registers every robot under src/lerobot_robot_sparklab/robots/,
# so `lerobot-record --robot.type=yam_ultra_bimanual ...`, `lerobot-rollout`
# and friends work with no wrapper script. See the package __init__.
name = "lerobot_robot_sparklab"
version = "0.1.0"
description = "SparkLab robotics stack: Quest VR teleoperation, relay, and LeRobot Robot/Teleoperator plugins for the lab's robots"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["robotics", "teleoperation", "webxr", "quest", "lerobot", "inverse-kinematics"]
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.2",
    "websockets>=13",
    # Hard dependency: __init__.py imports lerobot.robots/.teleoperators at
    # package-import time so plugin auto-discovery always succeeds.
    "lerobot>=0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Relay server: WebSocket broadcast + WebRTC camera streaming + WebXR page.
relay = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiortc>=1.9",
    "av>=12",
    "opencv-python-headless>=4.10",
]
# RealSense cameras (the rigs' camera sets and the cameras/ tooling).
realsense = [
    "pyrealsense2>=2.55",
]
# Per-robot hardware drivers. i2rt is not on PyPI — see the README.
yam-ultra = [
    "portal>=3.7",
]
# Optional desktop pose viewer for Quest-to-IK mapping diagnostics.
debug = [
    "rerun-sdk>=0.33.1",
]

[project.scripts]
sparklab-relay = "lerobot_robot_sparklab.relay.server:main"
sparklab-harness = "lerobot_robot_sparklab.harness.server:main"
sparklab-rollout = "lerobot_robot_sparklab.rollout.live:main"
sparklab-rollout-ctl = "lerobot_robot_sparklab.rollout.ctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_robot_sparklab", "src/sparklab_sim"]

[tool.hatch.build.targets.wheel.force-include]
"src/lerobot_robot_sparklab/harness/web" = "lerobot_robot_sparklab/harness/web"
"src/lerobot_robot_sparklab/relay/web" = "lerobot_robot_sparklab/relay/web"
